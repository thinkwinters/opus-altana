name: Diagnosticar cadastro de teste do Opus Altana
on:
  push:
    paths:
      - ".github/workflows/diagnostico-cadastro-altana.yml"
permissions:
  contents: read
jobs:
  testar-producao:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enviar um unico cadastro sintetico e obter resposta HTTP
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          (async () => {
            const site = 'https://opusaltanacondominio.com/';
            const payload = {
              name: 'TESTE TECNICO - NAO E CLIENTE',
              email: 'teste-opus-altana@example.com',
              phone: '+5562999999999',
              source: 'contact',
              placement: 'contato',
              pageUrl: site + '?utm_source=diagnostico-tecnico',
              requestId: crypto.randomUUID(),
              website: '',
              consent: true
            };
            const response = await fetch(site + 'api/leads', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Origin': site.slice(0, -1),
                'Referer': site,
                'User-Agent': 'OpusAltanaDiagnostic/1.0'
              },
              body: JSON.stringify(payload),
              signal: AbortSignal.timeout(18000)
            });
            console.log('DIAGNOSTICO_STATUS=' + response.status);
            console.log('DIAGNOSTICO_BODY=' + (await response.text()).slice(0,1000));
          })().catch(e => {console.log('DIAGNOSTICO_ERRO_REDE=' + e.name); process.exitCode=1});
          NODE
