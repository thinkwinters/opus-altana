name: Teste temporario do envio de leads do Altana
on:
  push:
    paths:
      - '.github/workflows/diagnostico-email-real.yml'
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar cadastros de teste sem ativar Pixel ou CAPI
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          async function test(source, placement) {
            const base = 'https://opusaltanacondominio.com';
            const body = {
              name: 'TESTE TECNICO OPUS ALTANA - NAO E CLIENTE',
              email: 'teste-altana@example.com',
              phone: '+5562999999999',
              source, placement,
              pageUrl: base + '/?utm_source=teste-tecnico&utm_campaign=validacao-resend',
              requestId: crypto.randomUUID(),
              website: '', consent: true
            };
            const response = await fetch(base + '/api/leads', {
              method: 'POST',
              headers: {
                Origin: base,
                Referer: base + '/',
                'Content-Type': 'application/json',
                'User-Agent': 'OpusAltana-Integration-Test/1.0'
              },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(20000)
            });
            const result = await response.text();
            console.log('FORM='+source);
            console.log('HTTP_STATUS='+response.status);
            console.log('RESULT='+result.slice(0,500));
            if (!response.ok) process.exitCode=1;
          }
          (async()=>{await test('contact','contato');await test('whatsapp','financiamento')})()
            .catch(error=>{console.error('DIAGNOSTIC_NETWORK_ERROR='+error.name);process.exitCode=1});
          NODE
