name: Diagnostico temporario da API de leads
on:
  push:
    paths:
      - ".github/workflows/testar-api-altana.yml"
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar resposta POST do dominio publico
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const site = 'https://opusaltanacondominio.com/';
            const payload = {
              name: 'TESTE TÉCNICO OPUS ALTANA - NÃO É LEAD',
              email: 'teste-altana@example.com',
              phone: '+5562999999999',
              source: 'contact',
              placement: 'contato',
              pageUrl: site + '?utm_source=github-diagnostic',
              requestId: require('node:crypto').randomUUID(),
              website: '',
              consent: true
            };
            try {
              const response = await fetch(site + 'api/leads', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Origin: site.slice(0,-1),
                  Referer: site
                },
                body: JSON.stringify(payload),
                signal: AbortSignal.timeout(15000)
              });
              console.log('API_STATUS=' + response.status);
              console.log('API_RESPONSE=' + (await response.text()).slice(0,1500));
            } catch (error) {
              console.log('API_NETWORK_ERROR=' + error.name + ': ' + error.message);
              process.exitCode = 1;
            }
          })();
          NODE
